<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render Queue</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a64; --line: #e3e0da;
  --accent: #2f6fdb; --ok: #2e8540; --warn: #b7791f; --bad: #c0392b; --bar: #e8e6e1; --code: #f1efea;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948; --s0: #a3a19b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #9b978f; --line: #2f2e2b;
    --accent: #6ea0ff; --ok: #5cbf73; --warn: #e0a84a; --bad: #ef6b5b; --bar: #2c2b28; --code: #191917;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s0: #6b6964;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #9b978f; --line: #2f2e2b;
  --accent: #6ea0ff; --ok: #5cbf73; --warn: #e0a84a; --bad: #ef6b5b; --bar: #2c2b28; --code: #191917;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s0: #6b6964;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
.sub { color: var(--muted); font-size: 13px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
.big { font-size: 15px; margin-top: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.proj { font-weight: 600; }
.name { color: var(--muted); }
.bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 12px 0 6px; }
.bar > div { height: 100%; background: var(--accent); transition: width .5s; }
.bar.over > div { background: var(--warn); }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 12px 0 0;
  font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all;
  max-height: 260px; overflow: auto; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: none; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; }
.tag.done { color: var(--ok); } .tag.failed, .tag.lost { color: var(--bad); } .tag.cancelled { color: var(--muted); }
.tag.paused, .tag.unwatched { color: var(--warn); } .tag.unseen { color: var(--accent); }
.why { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { color: var(--muted); padding: 14px 16px; background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; }
.warn { border-color: var(--warn); }
.id { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); word-break: break-all; }
.cores-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.hero { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.meter { position: relative; display: flex; height: 14px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 12px 0 10px; }
.meter > div { height: 100%; border-right: 2px solid var(--panel); transition: width .6s; }
.meter > div:last-child { border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; }
.legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
a.proj { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
a.proj:hover { border-bottom-color: var(--ink); }
.prog { display: inline-flex; align-self: center; vertical-align: middle; }
.prog + .prog { margin-left: 4px; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; z-index: 10; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.click:focus-visible td { background: var(--code); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tile .pic:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.out { color: var(--muted); font-size: 13px; white-space: nowrap; }
/* the sheet: what is at the outputs a job declared */
#sheet[hidden], #lightbox[hidden] { display: none; }
#sheet { position: fixed; inset: 0; z-index: 20; }
.sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
.sheet-panel { position: absolute; top: 24px; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: min(1100px, calc(100% - 32px)); overflow: auto; background: var(--bg); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  padding: 16px 20px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-head .row { font-size: 17px; }
#sheet-body { padding: 4px 20px 24px; }
#sheet-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 7px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.x { font-size: 20px; line-height: 1; padding: 4px 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.acts a { font-size: 13px; color: var(--accent); }
.vid { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.vid video { display: block; width: 100%; max-height: 62vh; background: #000; border-radius: 6px; }
.fname { font-size: 14px; word-break: break-all; }
.fname .sub { margin-left: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; display: flex; flex-direction: column; }
.tile .pic { aspect-ratio: 16 / 10; background: #111; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
.tile .pic img { width: 100%; height: 100%; object-fit: contain; }
.tile .cap { padding: 6px 8px; font-size: 12px; word-break: break-all; }
.tile .cap .acts { margin-top: 4px; }
.tile.file .pic { cursor: default; color: var(--muted); font-size: 12px; padding: 10px; text-align: center; background: var(--code); }
.seq { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.seq .frame { background: #111; border-radius: 6px; display: flex; justify-content: center; margin-top: 10px; }
.seq .frame img { max-width: 100%; max-height: 56vh; object-fit: contain; }
.seq input[type=range] { width: 100%; margin: 10px 0 2px; }
.note { color: var(--muted); font-size: 12px; margin-top: 22px; }
.outs { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
.outs .o { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 0; }
.outs .o + .o { border-top: 1px solid var(--line); }
.outs code { font: 13px ui-monospace, Menlo, monospace; word-break: break-all; }
.outs .missing { color: var(--warn); }
.outs .acts { margin-top: 0; }
#lightbox { position: fixed; inset: 0; z-index: 30; background: #0b0b0a; display: flex; flex-direction: column; }
#lightbox .lb-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
#lightbox .lb-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; color: #ddd; font-size: 13px; }
#lightbox .lb-bar .fname { color: #ddd; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg);
  padding: 7px 14px; border-radius: 8px; font-size: 13px; display: none; }
@media (max-width: 600px) { .sheet-panel { top: 0; bottom: 0; width: 100%; border-radius: 0; border: none; }
  .sheet-head { padding: 12px 16px 10px; } #sheet-body { padding: 4px 16px 20px; } .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .hide-sm { display: none; } th, td { padding: 7px 8px; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Render queue</h1>
      <div class="sub" id="dispatcher"><span class="dot"></span>connecting…</div>
    </div>
    <div style="text-align:right"><div class="big" id="alldone"></div>
      <button id="notify" hidden style="margin-top:6px"></button></div>
  </header>

  <div id="waiting"></div>

  <h2>CPU and GPU</h2>
  <div class="card"><div id="cores"><span class="sub">measuring…</span></div>
    <div id="gpu" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"></div></div>
  <div id="tip"></div>

  <h2>Rendering now</h2>
  <div id="running"></div>

  <div id="outside"></div>

  <h2>Up next</h2>
  <div id="queue"></div>

  <h2>Recent</h2>
  <div id="recent"></div>
</main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-back"></div>
  <div class="sheet-panel">
    <div class="sheet-head"><div><div id="sheet-title" class="row"></div><div id="sheet-meta" class="sub" style="margin-top:4px"></div></div>
      <button class="x" id="sheet-close" aria-label="Close">×</button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Picture">
  <div class="lb-img"><img id="lb-img" alt=""><div id="lb-msg" hidden style="color:#bbb;font-size:14px"></div></div>
  <div class="lb-bar"><button id="lb-prev" aria-label="Previous picture">‹</button>
    <div style="flex:1;min-width:0"><div id="lb-name" class="fname"></div><div class="acts" id="lb-acts"></div></div>
    <button id="lb-next" aria-label="Next picture">›</button><button id="lb-close" aria-label="Close">×</button></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = id => document.getElementById(id);
// the tab icon: an old movie camera with two film reels; an amber dot while a session waits for you (also one whose
// turn ended while none of its tasks watches its jobs: the dispatcher lists them, and its results nobody has seen,
// in the session's notes)
const favicon = waiting => {
  const reel = (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="5.2" fill="#e8e6e1"/>
    <circle cx="${cx}" cy="${cy}" r="1.4" fill="#1d1c1a"/>
    <circle cx="${cx}" cy="${cy - 2.9}" r="1" fill="#1d1c1a"/><circle cx="${cx + 2.5}" cy="${cy + 1.45}" r="1" fill="#1d1c1a"/>
    <circle cx="${cx - 2.5}" cy="${cy + 1.45}" r="1" fill="#1d1c1a"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" fill="#1d1c1a"/>
    ${reel(9, 9.5)}${reel(19.5, 9.5)}
    <rect x="4" y="15.5" width="18" height="10.5" rx="2" fill="#e8e6e1"/>
    <path d="M22 19.2 28.5 16v9.5L22 22.3z" fill="#3987e5"/>
    <rect x="6.5" y="27" width="3" height="2" fill="#e8e6e1"/><rect x="16" y="27" width="3" height="2" fill="#e8e6e1"/>
    ${waiting ? '<circle cx="26.5" cy="5.5" r="4.5" fill="#fab219" stroke="#1d1c1a" stroke-width="1.5"/>' : ""}</svg>`;
  const href = "data:image/svg+xml," + encodeURIComponent(svg);
  if ($("favicon").getAttribute("href") !== href) $("favicon").setAttribute("href", href);
};
favicon(false);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false}) : "?";
const day = ts => {
  if (!ts) return "?";
  const d = new Date(ts * 1000), now = new Date();
  return d.toDateString() === now.toDateString() ? t(ts) : d.toLocaleDateString([], {weekday: "short"}) + " " + t(ts);
};
const dur = s => {
  if (s == null) return "?";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h${String(m).padStart(2, "0")}m` : m ? `${m}m` : `${s}s`;
};
// how long a finished job ran, without the time it was paused or waiting in the queue; null if nobody saw it end
// (its record was closed by the dispatcher). A dispatcher from before "took" existed: start to end.
const took = j => "took" in j ? j.took : j.started && j.finished ? j.finished - j.started : null;
// who sees a job. A task that watches it gets its output and exit code; stopping that task doesn't cancel the job.
// Fields from the dispatcher; an older one has none of them, and then no tag shows.
const SEEN_TIP = {
  unwatched: "No task of the session that queued this job watches it, so that session gets no output or exit code when it ends (a terminal or another session following it doesn't count). Stopping a task doesn't cancel a job: rq cancel ID does, and rq wait ID follows it again.",
  unseen: "Its result hasn't reached the session that queued it: no task of that session showed it. That session gets it with rq mine or rq wait ID.",
  ended: " The session that queued it has no Claude process any more (archived or closed).",
  owner: "Its rq supervisor ended without recording a result (killed or crashed). The job keeps its turn until its processes end; then it is recorded as lost.",
};
const seenTag = (kind, j) => ` <span class="tag ${kind}" title="${esc(SEEN_TIP[kind] + (j.session_ended ? SEEN_TIP.ended : ""))}">${kind}${j.session_ended ? " · session ended" : ""}</span>`;
const seenTags = j => (j.owner_alive === false ? ` <span class="tag lost" title="${esc(SEEN_TIP.owner)}">supervisor gone</span>` : "")
  + (j.unwatched ? seenTag("unwatched", j) : "") + (j.unseen ? seenTag("unseen", j) : "");
// why a job ended as it did (lost, cancelled, failed: the dispatcher or its supervisor says), without "see rq log ID"
const reasonText = j => j.reason && j.status !== "done" ? j.reason.replace(/\s*\(see rq log [^)]*\)/g, "") : "";
const why = j => reasonText(j) ? `<div class="why">${esc(reasonText(j))}</div>` : "";
// only the program a job runs (e.g. "blender"): rq works it out and never sends the command line itself
const program = j => String(j.program || "");
// small simplified logos in place of the program's name, for the programs most jobs run
const ICONS = {
  Blender: `<svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Blender"><title>Blender</title>
    <path d="M1.2 4.3h6.2l-1.1 1.5H3.6z M2.6 1.9l5.6 3.1-1.3 1.2-4.6-2.6z" fill="#e87d0d"/>
    <circle cx="9.6" cy="9.4" r="5.4" fill="#e87d0d"/><circle cx="9.6" cy="9.4" r="3.4" fill="#fff"/>
    <circle cx="9.6" cy="9.4" r="2" fill="#265787"/></svg>`,
  Python: `<svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Python"><title>Python</title>
    <path d="M7.9 1C4.8 1 5 2.4 5 2.4v1.4h3v.5H3.6S1.5 4 1.5 7.4s1.8 3.2 1.8 3.2h1.1V9s-.1-1.8 1.8-1.8h3s1.7 0 1.7-1.7V2.7S11.2 1 7.9 1z" fill="#3776ab"/>
    <circle cx="6.3" cy="2.5" r=".55" fill="#fff"/>
    <path d="M8.1 15c3.1 0 2.9-1.4 2.9-1.4v-1.4H8v-.5h4.4s2.1.3 2.1-3.1-1.8-3.2-1.8-3.2h-1.1V7s.1 1.8-1.8 1.8h-3s-1.7 0-1.7 1.7v2.8S4.8 15 8.1 15z" fill="#ffd43b"/>
    <circle cx="9.7" cy="13.5" r=".55" fill="#fff"/></svg>`,
  FFmpeg: `<svg viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="FFmpeg"><title>FFmpeg</title>
    <path d="M1.5 1.5h5l-5 5z M1.5 9.5l8-8h5l-13 13z M6.5 14.5l8-8v-5h0z M9.5 14.5l5-5v5z" fill="#0b8a00"/></svg>`,
};
const TOOL_NAMES = {blender: "Blender", python: "Python", ffmpeg: "FFmpeg"};
// the logos of the tools a job runs (rq reads the command and the scripts it starts), else nothing
const toolLogos = j => (j.tools || []).filter(t => TOOL_NAMES[t]).map(t =>
  `<span class="prog" title="${TOOL_NAMES[t]}">${ICONS[TOOL_NAMES[t]]}</span>`).join("");
const programKind = p => /^blender$/i.test(p) ? "Blender" : (/^python[\d.]*$/i.test(p) || p === "py" || /\.py$/.test(p)) ? "Python" : null;
const programLogo = j => { const k = programKind(program(j)); return k ? `<span class="prog" title="${k}">${ICONS[k]}</span>` : ""; };
// the queue table's tool column: the logo when there is one, else the program's name
const programTool = j => toolLogos(j) || programLogo(j) || `<span class="sub">${esc(program(j))}</span>`;
const programText = j => { const p = program(j); return p && !toolLogos(j) && !programKind(p) ? `<div class="id">${esc(p)}</div>` : ""; };
const jobLogos = j => toolLogos(j) || programLogo(j);
// a color per project: the sessions the dispatcher watches in name order, else the projects using cores; a project
// keeps its color while the page is open
const SLOTS = [];
const color = p => SLOTS.includes(p) ? `var(--s${SLOTS.indexOf(p) % 8 + 1})` : "var(--s0)";  // others and unknown: gray
const cores = n => n >= 10 ? n.toFixed(0) : n.toFixed(1);

// sessions waiting for the user: read by the dispatcher from each session's transcript, longest waiting first
const WAIT_LABEL = {waiting: "waiting for you", question: "asked you a question", permission: "may need your permission"};
function showWaiting(sessions) {
  if (!sessions || !sessions.length) { $("waiting").innerHTML = ""; return; }  // no session watched (state/sessions.json)
  const now = Date.now() / 1000;
  const waiting = sessions.filter(x => !["working", "jobs"].includes(x.state)).sort((a, b) => (a.since || 0) - (b.since || 0));
  const working = sessions.filter(x => x.state === "working").map(x => x.project);
  const name = x => x.link ? `<a href="${esc(x.link)}" class="proj">${esc(x.project)}</a>` : `<span class="proj">${esc(x.project)}</span>`;
  // what the session may not know: its project's jobs that no task watches (they won't wake it), results nobody has seen
  const noteText = n => n.unwatched ? `${n.name} ${n.what}, ${n.elsewhere ? "no task of this session watches it" : "nobody watches it"}`
    : `${n.name} ${n.what}${n.what === "failed" && n.exit != null ? " (exit " + n.exit + ")" : ""} at ${t(n.finished)}, nobody has seen the result`;
  const notes = x => (x.notes || []).map(n => `<div class="why">${esc(noteText(n))}</div>`).join("");
  $("waiting").innerHTML = `<h2>Waiting for you</h2>${waiting.length ? `<table>
    <tr><th>Session</th><th>State</th><th>Since</th><th class="hide-sm">Background</th></tr>
    ${waiting.map(x => `<tr><td>${name(x)}</td>
      <td>${x.state === "waiting" ? WAIT_LABEL[x.state] : `<span class="tag paused">${WAIT_LABEL[x.state]}${x.tool ? " · " + esc(x.tool) : ""}</span>`}${notes(x)}</td>
      <td class="num">${x.since ? day(x.since) + ` <span class="sub">(${dur(now - x.since)})</span>` : "?"}</td>
      <td class="hide-sm sub">${x.background ? x.background + " task" + (x.background > 1 ? "s" : "") + " running" : ""}</td></tr>`).join("")}</table>`
    : `<div class="empty">No session is waiting for you.</div>`}
    ${working.length ? `<div class="sub" style="margin-top:8px">Working: ${working.map(esc).join(", ")}</div>` : ""}`;
}

function showGpu(g) {
  if (!g || g.util == null) { $("gpu").innerHTML = `<span class="sub">GPU utilization unavailable</span>`; return; }
  $("gpu").innerHTML = `<div class="cores-head"><span class="hero">${g.util}%</span>
      <span class="sub">GPU utilization${g.cores ? ` (${g.cores} GPU cores)` : ""} · whole GPU, average over the last 10 s</span></div>
    <div class="meter" role="img" aria-label="GPU ${g.util}% utilized" title="macOS reports GPU use only for the whole GPU, not per session">
      <div style="width:${Math.min(100, g.util)}%;background:var(--muted)"></div></div>`;
}

function showCores(u) {
  if (!u || !u.projects) { $("cores").innerHTML = `<span class="sub">${u && u.error ? "core usage unavailable" : "measuring…"}</span>`; return; }
  const rows = Object.entries(u.projects).map(([p, v]) => ({p, ...v}));
  const busy = rows.filter(r => r.cores >= 0.05).sort((a, b) => b.cores - a.cores);
  const order = [...busy].sort((a, b) => (SLOTS.indexOf(a.p) + 99 * !SLOTS.includes(a.p)) - (SLOTS.indexOf(b.p) + 99 * !SLOTS.includes(b.p)));
  // everything else on the machine (system, apps, the dispatcher), always last, in neutral gray
  const others = {p: "others", cores: Math.max(0, u.machine - u.sessions), low: 0, other: true};
  if (others.cores >= 0.05) { order.push(others); busy.push(others); }
  const tipText = r => r.other ? `<b>others</b> · ${cores(r.cores)} cores: system, apps and everything outside the projects`
    : `<b>${esc(r.p)}</b> · ${cores(r.cores)} cores${r.low >= 0.05 ? ` (${cores(r.low)} light)` : ""}`;
  $("cores").innerHTML = `<div class="cores-head"><span class="hero">${cores(u.sessions)} of ${u.cores}</span>
      <span class="sub">cores used by the projects</span></div>
    <div class="meter" role="img" aria-label="${esc(busy.map(r => r.p + " " + cores(r.cores) + " cores").join(", ") || "no session is using the CPU")}">
      ${order.map(r => `<div data-p="${esc(r.p)}" style="width:${Math.min(100, 100 * r.cores / u.cores)}%;background:${color(r.p)}"></div>`).join("")}</div>
    <div class="legend">${busy.sort((a, b) => (!!a.other - !!b.other) || (b.cores - a.cores)).map(r => `<span><span class="sw" style="background:${color(r.p)}"></span>${esc(r.p)} <b>${cores(r.cores)}</b>${r.low >= r.cores / 2 ? ' <span class="sub">light</span>' : ""}</span>`).join("") || '<span class="sub">no session is using the CPU</span>'}</div>`;
  const tip = $("tip");
  $("cores").querySelectorAll(".meter > div").forEach(el => {
    const r = busy.find(x => x.p === el.dataset.p);
    el.onmousemove = e => { tip.innerHTML = tipText(r); tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; };
    el.onmouseleave = () => { tip.style.display = "none"; };
  });
}

// browser notifications while this page is open: a job that isn't light ends (not when it was cancelled), or a
// session starts waiting for you
const notifyKey = "rq-notify";
const notifyOn = () => { try { return localStorage.getItem(notifyKey) === "1"; } catch (e) { return false; } };
const showNotify = () => {
  const b = $("notify");
  if (!("Notification" in window)) { b.hidden = true; return; }
  b.hidden = false;
  const perm = Notification.permission;
  b.disabled = perm === "denied";
  b.textContent = perm === "denied" ? "Notifications blocked by the browser"
    : perm === "granted" && notifyOn() ? "Notifying: renders end, sessions wait" : "Notify me when a render ends or a session waits";
};
$("notify").addEventListener("click", async () => {
  if (Notification.permission !== "granted") {
    if (await Notification.requestPermission() !== "granted") { showNotify(); return; }
    try { localStorage.setItem(notifyKey, "1"); } catch (e) {}
  } else {
    try { localStorage.setItem(notifyKey, notifyOn() ? "0" : "1"); } catch (e) {}
  }
  showNotify();
});
showNotify();
let ended = null;  // ids of jobs already ended when this page saw them
const notifyEnded = finished => {
  const fresh = ended ? finished.filter(j => !ended.has(j.id)) : [];
  ended = new Set(finished.map(j => j.id));
  if (!notifyOn() || !("Notification" in window) || Notification.permission !== "granted") return;
  for (const j of fresh) {
    if (j.kind === "light" || j.status === "cancelled") continue;
    const result = j.status === "failed" && j.exit != null ? "failed " + j.exit : j.status;
    const n = new Notification(`${j.project}/${j.name} ${result}`, {tag: "rq-" + j.id,
      body: [j.took != null ? "took " + dur(j.took) : "", j.reason || ""].filter(Boolean).join(" · ")});
    n.onclick = () => { window.focus(); openSheet(j.id); n.close(); };
  }
};
let waitSeen = null;  // project -> state and since of each session waiting for you, as this page last saw it
const notifyWaiting = sessions => {
  const now = new Map((sessions || []).filter(x => !["working", "jobs"].includes(x.state))
    .map(x => [x.project, {x, key: x.state + "@" + x.since}]));
  const fresh = waitSeen ? [...now.values()].filter(w => waitSeen.get(w.x.project) !== w.key).map(w => w.x) : [];
  waitSeen = new Map([...now].map(([p, w]) => [p, w.key]));
  if (!notifyOn() || !("Notification" in window) || Notification.permission !== "granted") return;
  for (const x of fresh) {
    const n = new Notification(`${x.project} ${WAIT_LABEL[x.state] || "waiting for you"}`, {tag: "rq-session-" + x.project,
      body: [x.tool || "", ...(x.notes || []).map(m => m.name + " " + m.what)].filter(Boolean).join(" · ")});
    n.onclick = () => { window.focus(); if (x.link) location.href = x.link; n.close(); };
  }
};

async function refresh() {
  let s;
  try { s = await (await fetch("/api/status", {cache: "no-store"})).json(); }
  catch (e) { $("dispatcher").innerHTML = '<span class="dot off"></span>status page offline'; return; }
  const d = s.dispatcher;
  const watched = (d.sessions || []).map(x => x.project);
  (watched.length ? watched : Object.keys((d.usage || {}).projects || {})).sort().forEach(p => SLOTS.includes(p) || SLOTS.push(p));
  $("dispatcher").innerHTML = d.alive
    ? `<span class="dot on"></span>dispatcher running · ${esc(d.note || "")}`
    : `<span class="dot off"></span>dispatcher not running`;
  showWaiting(d.sessions);
  notifyEnded(s.finished);
  notifyWaiting(d.sessions);
  favicon((d.sessions || []).some(x => !["working", "jobs"].includes(x.state)));
  showCores(d.usage);
  showGpu(d.gpu);
  const busy = s.running || s.queued.length;
  $("alldone").textContent = busy ? (s.all_done ? `All done ~${day(s.all_done)}` : "All done: unknown (no estimate)") : "Queue empty";

  const r = s.running;
  const light = s.light || [];
  const heavyCard = r => {
    const pct = r.expected ? Math.min(100, 100 * r.elapsed / r.expected) : 0;
    const over = r.expected && r.elapsed > r.expected;
    return `<div class="card">
      <div class="row"><span class="proj">${esc(r.project)}</span><span class="name">${esc(r.name)}</span>${jobLogos(r)}
        ${r.paused ? '<span class="tag paused">paused</span>' : ""}${seenTags(r)}</div>
      <div class="bar ${over ? "over" : ""}"><div style="width:${r.expected ? pct : 100}%;${r.expected ? "" : "opacity:.25"}"></div></div>
      <div class="row sub"><span>started ${t(r.started)}</span><span>${dur(r.elapsed)} elapsed</span>
        <span>expected ${dur(r.expected)}</span><span>${r.eta ? (over ? "overdue since " : "done ~") + day(r.eta) : "no estimate"}</span></div>
      ${programText(r)}</div>`;
  };
  // light work runs next to the queue's job: same section, annotated, without a progress bar
  const lightCard = j => `<div class="card" style="margin-top:8px">
      <div class="row"><span class="proj">${esc(j.project)}</span><span class="name">${esc(j.name)}</span>${jobLogos(j)}
        <span class="tag">light</span>${seenTags(j)}</div>
      <div class="row sub" style="margin-top:6px"><span>started ${t(j.started || j.submitted)}</span><span>${dur(j.elapsed)} elapsed</span></div>
      ${programText(j)}</div>`;
  $("running").innerHTML = (r || light.length) ? (r ? heavyCard(r) : `<div class="empty">No queued job is rendering.</div>`) + light.map(lightCard).join("")
    : `<div class="empty">No queued job is rendering.</div>`;

  const w = d.warnings || [];
  const line = x => `<div>${esc(x.project)} · ${esc(x.what)}${x.paused ? " (paused)" : ""} · ${x.count > 1 ? x.count + " processes" : "pid " + x.pid}${x.cpu ? " · " + (x.cpu / 100).toFixed(1) + " cores" : ""}</div>`;
  const hard = w.filter(x => !x.low), soft = w.filter(x => x.low);
  $("outside").innerHTML = w.length ? `<h2>Outside the queue</h2>
    ${hard.length ? `<div class="card warn">${hard.map(line).join("")}
      <div class="sub">Heavy work at normal priority that wasn't started with rq. ${r ? "" : "The queue waits until it ends."}</div></div>` : ""}
    ${soft.length ? `<div class="card" style="margin-top:8px">${soft.map(line).join("")}
      <div class="sub">Light (nice 10 or more): it doesn't hold the queue and yields to queued jobs.</div></div>` : ""}` : "";

  $("queue").innerHTML = s.queued.length ? `<table><tr><th>#</th><th>Project</th><th>Job</th><th>Tool(s)</th><th class="hide-sm">Queued</th>
    <th>Expected</th><th>Start</th><th>Done</th></tr>${s.queued.map((j, i) => `<tr><td class="num">${i + 1}</td>
    <td class="proj">${esc(j.project)}</td><td>${esc(j.name)}${j.promoted ? ' <span class="tag paused" title="It ran longer than 5 min as light work while other work was waiting, so it was paused and moved into the queue">paused · was light</span>' : ""}${seenTags(j)}</td><td>${programTool(j)}</td><td class="num hide-sm">${t(j.submitted)}</td>
    <td class="num">${dur(j.expected)}</td><td class="num">~${day(j.eta_start)}</td><td class="num">~${day(j.eta)}</td></tr>`).join("")}</table>`
    : `<div class="empty">Nothing waiting.</div>`;
  // the second queue: light jobs wait for the one light slot, independent of the main queue
  const lq = s.light_queued || [];
  $("queue").innerHTML += lq.length ? `<div class="sub" style="margin:14px 0 8px">Light queue · one light job at a time</div>
    <table><tr><th>#</th><th>Project</th><th>Job</th><th>Tool(s)</th><th class="hide-sm">Queued</th></tr>
    ${lq.map((j, i) => `<tr><td class="num">${i + 1}</td><td class="proj">${esc(j.project)}</td><td>${esc(j.name)} <span class="tag">light</span>${seenTags(j)}</td>
      <td>${programTool(j)}</td><td class="num hide-sm">${t(j.submitted)}</td></tr>`).join("")}</table>` : "";

  const recent = s.finished.length ? `<table><tr><th>Finished</th><th>Project</th><th>Job</th><th>Tool(s)</th><th>Took</th><th>Result</th><th class="hide-sm">Output</th></tr>
    ${s.finished.slice(0, 10).map(j => `<tr class="click" data-job="${esc(j.id)}" tabindex="0" title="Show what is at the outputs it declared"><td class="num">${day(j.finished)}</td><td class="proj">${esc(j.project)}</td><td>${esc(j.name)}${j.kind === "light" ? ' <span class="tag">light</span>' : ""}${why(j)}</td>
    <td>${programTool(j)}</td><td class="num">${took(j) == null ? "-" : dur(took(j))}</td>
    <td><span class="tag ${esc(j.status)}">${esc(j.status)}${j.exit != null && j.status === "failed" ? " " + j.exit : ""}</span>${seenTags(j)}</td>
    <td class="out hide-sm">${outputText(j)}</td></tr>`).join("")}</table>`
    : `<div class="empty">No finished jobs yet.</div>`;
  if (recent !== refresh.recent) {  // rebuilding every 3 s would drop keyboard focus and swallow clicks
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest("#recent tr[data-job]");
    $("recent").innerHTML = refresh.recent = recent;
    if (focused) { const row = $("recent").querySelector(`tr[data-job="${CSS.escape(focused.dataset.job)}"]`); if (row) row.focus(); }
  }
}


// ---------- the sheet: what is at the outputs a job declared ----------
// how many outputs a job declared (rq run --output), "none" if it said it writes none, nothing for older jobs
const outputText = j => j.no_output ? "none" : j.output_count ? `${j.output_count} output${j.output_count > 1 ? "s" : ""}` : "";
const size = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(1) + " MB" : b >= 1e3 ? Math.round(b / 1e3) + " KB" : b + " B";
const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
let sheet = null;  // {job, pictures: [artifact], lb: index, opener: job id}
const byKey = key => sheet && sheet.job.artifacts.find(a => a.key === key);
const fileUrl = (a, frame) => `/api/file/${encodeURIComponent(sheet.job.id)}/${a.key}${frame != null ? "/" + frame : ""}?v=${Math.round(a.mtime)}`;
const toast = text => { const el = $("toast"); el.textContent = text; el.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.style.display = "none", 2200); };
async function onMac(how, key, frame) {
  try {
    const r = await fetch(`/api/${how}/${encodeURIComponent(sheet.job.id)}/${key}${frame != null ? "/" + frame : ""}`, {method: "POST"});
    toast(r.ok ? (how === "open" ? "Opened on the Mac" : "Shown in the Finder") : "It isn't there any more");
  } catch (e) { toast("The status page is offline"); }
}
// buttons for a file: open it on the Mac with its usual app, show it in the Finder, the file itself in a new tab
const acts = (a, frame, inBrowser) => `<div class="acts">
  <button data-mac="open" data-key="${a.key}"${frame != null ? ` data-frame="${frame}"` : ""}>Open on Mac</button>
  <button data-mac="reveal" data-key="${a.key}"${frame != null ? ` data-frame="${frame}"` : ""}>Show in Finder</button>
  ${inBrowser ? `<a href="${fileUrl(a, frame)}" target="_blank" rel="noopener">full file ↗</a>` : ""}</div>`;
// a sequence's frames: ranges of numbers, picked by position
const frameAt = (a, i) => { for (const [lo, hi] of a.frames) { if (i <= hi - lo) return lo + i; i -= hi - lo + 1; } return a.frames[a.frames.length - 1][1]; };
const frameName = (a, f) => a.prefix + (a.width ? String(f).padStart(a.width, "0") : String(f)) + a.suffix;
const cantShow = a => `${esc(a.ext.slice(1).toUpperCase())}: this browser can't show it`;
const fileCard = (a, why) => `<div class="tile file"><div class="pic">${why}</div>
  <div class="cap"><div class="fname">${esc(a.name)}</div><div class="sub">${esc(a.dir)} · ${size(a.size)}</div>${acts(a, null, false)}</div></div>`;
const AUTOLOAD_VIDEOS = 3;  // more at once can stall a browser's connections to the page (Firefox)

// one line per declared output: its path in the project, and what is there now
const KIND_WORD = {file: "file", folder: "folder", pattern: "frame pattern"};
function outputState(o) {
  if (o.state === "missing") return o.kind === "pattern" ? "no frames there" : "not there";
  if (o.state === "refused") return o.kind === "folder" ? "not a folder in the project" : "not a picture or video file in the project";
  if (o.state === "empty") return o.kind === "pattern" ? "no frames there" : "nothing the page can show there";
  if (o.kind === "pattern") return o.videos ? count(o.videos, "video", "videos") : `${count(o.frames, "frame", "frames")}, ${o.first} to ${o.last}`;
  if (o.kind === "file") return "here";
  return [o.videos && count(o.videos, "video", "videos"), o.pictures && count(o.pictures, "picture", "pictures"),
          o.sequences && count(o.sequences, "frame sequence", "frame sequences")].filter(Boolean).join(", ");
}
const outputRow = o => `<div class="o"><code>${esc(o.path)}</code><span class="sub${o.state === "here" ? "" : " missing"}">${KIND_WORD[o.kind] || esc(o.kind)} · ${outputState(o)}</span>
  ${o.kind === "folder" && o.state !== "missing" && o.state !== "refused" ? `<div class="acts"><button data-mac="reveal" data-key="${o.key}">Show in Finder</button></div>` : ""}</div>`;

function videoCard(a, i) {
  const player = i < AUTOLOAD_VIDEOS
    ? `<video controls preload="metadata" playsinline src="${fileUrl(a)}"></video>`
    : `<video controls preload="none" playsinline data-src="${fileUrl(a)}" hidden></video>
       <button data-load="${a.key}">▶ Load video</button>`;
  return `<div class="vid" data-key="${a.key}">${player}
    <div class="fname" style="margin-top:8px">${esc(a.name)}<span class="sub">${esc(a.dir)} · ${size(a.size)}</span></div>${acts(a, null, true)}</div>`;
}

// a video this browser can't play (e.g. ProRes outside Safari): a note and the Mac buttons instead
function watchVideo(el) {
  const fail = () => { const card = el.closest(".vid"); if (!card) return;
    card.querySelectorAll('a[target="_blank"], button[data-load]').forEach(x => x.remove());
    releaseVideo(el);
    el.outerHTML = `<div class="tile file" style="border:none"><div class="pic" style="aspect-ratio:auto;padding:18px">This browser can't play this video. Open it on the Mac instead.</div></div>`; };
  el.addEventListener("error", fail);
  el.addEventListener("loadedmetadata", () => { if (!el.videoWidth) fail(); });
  if (el.error) fail();
  else if (el.readyState >= 1 && !el.videoWidth) fail();
}
function releaseVideo(el) { try { el.pause(); el.removeAttribute("src"); el.load(); } catch (e) {} }

function renderSheet(v) {
  sheet.job = v;
  $("sheet-title").innerHTML = `<span class="proj">${esc(v.project)}</span><span class="name">${esc(v.name)}</span>${v.kind === "light" ? ' <span class="tag">light</span>' : ""}
    ${jobLogos(v)} <span class="tag ${esc(v.status)}">${esc(v.status)}${v.exit != null && v.status === "failed" ? " " + v.exit : ""}</span>`;
  $("sheet-meta").textContent = v.pending ? (v.started ? `running since ${day(v.started)}` : "waiting in the queue")
    : (v.started ? `${day(v.started)} to ${day(v.finished)}${took(v) == null ? "" : " · took " + dur(took(v))}` : "never started")
      + (v.reason && v.status !== "done" ? " · " + v.reason : "");
  if (v.no_output) {
    $("sheet-body").innerHTML = `<div class="empty" style="margin-top:18px">This job writes no pictures or videos: its session said so when it queued it.</div>`;
    return;
  }
  if (!v.declared) {
    $("sheet-body").innerHTML = `<div class="empty" style="margin-top:18px">No outputs were declared for this job, so there is nothing to show.</div>`;
    return;
  }
  const videos = v.artifacts.filter(a => a.kind === "video"), pictures = v.artifacts.filter(a => a.kind === "image"),
        seqs = v.artifacts.filter(a => a.kind === "sequence");
  sheet.pictures = pictures.filter(a => a.browser);
  // a job that never ran wrote none of it: what is there comes from other work at the same paths
  let out = !v.started ? `<div class="note" style="margin-top:16px">${v.pending ? "This job hasn't started yet" : "This job never ran"}: anything shown here was written at these paths by other work, not by this job.</div>`
    : v.pending ? `<div class="note" style="margin-top:16px">This job hasn't finished yet: this is what is at its outputs so far.</div>` : "";
  out += `<h3>Outputs · ${v.outputs.length}</h3><div class="outs">${v.outputs.map(outputRow).join("")}</div>`;
  if (videos.length) out += `<h3>Videos · ${videos.length}</h3>` + videos.map(videoCard).join("");
  if (pictures.length) out += `<h3>Pictures · ${pictures.length}</h3><div class="grid">` + pictures.map(a => !a.browser
    ? fileCard(a, `${esc(a.ext.slice(1).toUpperCase())}: browsers can't show this`)
    : `<div class="tile" data-key="${a.key}"><div class="pic" data-lb="${a.key}" tabindex="0" role="button" aria-label="Show ${esc(a.name)} full size"><img loading="lazy" decoding="async" src="${fileUrl(a)}" alt="${esc(a.name)}"></div>
        <div class="cap"><div class="fname">${esc(a.name)}</div><div class="sub">${esc(a.dir)} · ${size(a.size)}</div></div></div>`).join("") + "</div>";
  if (seqs.length) out += `<h3>Frame sequences · ${seqs.length}</h3>` + seqs.map(a => {
    const first = a.frames[0][0], last = a.frames[a.frames.length - 1][1];
    const head = `<div class="fname">${esc(a.name)}<span class="sub">${esc(a.dir)} · ${count(a.count, "frame", "frames")}, ${first} to ${last} · ${size(a.size)}</span></div>`;
    const folder = `<div class="acts"><button data-mac="open" data-key="${a.key}">Open folder on Mac</button><button data-mac="reveal" data-key="${a.key}">Show in Finder</button></div>`;
    if (!a.browser) return `<div class="seq">${head}<div class="sub" style="margin-top:6px">${esc(a.ext.slice(1).toUpperCase())}: browsers can't show these frames</div>${folder}</div>`;
    return `<div class="seq" data-seq="${a.key}">${head}
      <div class="frame"><img alt="" src="${fileUrl(a, first)}"></div>
      <input type="range" min="0" max="${a.count - 1}" value="0" aria-label="Frame">
      <div class="acts"><button data-step="-1" aria-label="Previous frame">‹</button><button data-step="1" aria-label="Next frame">›</button>
        <span class="sub" data-label>${esc(frameName(a, first))} · 1 of ${a.count}</span></div>${folder}</div>`;
  }).join("");
  if (v.truncated) out += `<div class="note">${v.truncated} more pictures or videos aren't shown.</div>`;
  if (v.partial) out += `<div class="note">A declared folder holds more than the sheet looks through, so not all of it is shown.</div>`;
  if (v.started && !v.pending) out += `<div class="note">This is what is at the paths this job declared, as of now: what was written there after it ended shows too, and what was removed since doesn't.</div>`;
  $("sheet-body").innerHTML = out;
  $("sheet-body").querySelectorAll(".vid video").forEach(watchVideo);
  // a picture this browser can't show (e.g. TIFF outside Safari): a note and the Mac buttons instead
  $("sheet-body").querySelectorAll(".tile img").forEach(el => {
    const fail = () => { const tile = el.closest(".tile"); if (!tile) return; const a = byKey(tile.dataset.key);
      sheet.pictures = sheet.pictures.filter(p => p.key !== a.key);
      tile.outerHTML = fileCard(a, cantShow(a)); };
    el.addEventListener("error", fail);
    if (el.complete && !el.naturalWidth && el.getAttribute("src")) fail();
  });
  $("sheet-body").querySelectorAll("[data-seq]").forEach(setupSequence);
}

// scrubbing a sequence: load one frame at a time, always the newest asked for
function setupSequence(card) {
  const a = byKey(card.dataset.seq), img = card.querySelector("img"), range = card.querySelector("input"),
        label = card.querySelector("[data-label]");
  let want = 0, loading = false, shown = false;
  const cannot = async () => {  // the first frame failed: gone, or a format this browser can't show
    let gone = false;
    try { gone = !(await fetch(img.src, {method: "HEAD"})).ok; } catch (e) {}
    card.querySelector(".frame").outerHTML = `<div class="sub" style="margin-top:6px">${gone ? "the frames are gone" : esc(a.ext.slice(1).toUpperCase()) + ": this browser can't show these frames"}</div>`;
    range.remove(); card.querySelectorAll("[data-step]").forEach(b => b.remove()); label.remove();
  };
  img.onload = () => { shown = true; };
  img.onerror = () => { if (!shown) cannot(); };
  const show = () => { if (loading || !shown) return; loading = true; const i = want, f = frameAt(a, i);
    img.src = fileUrl(a, f); label.textContent = `${frameName(a, f)} · ${i + 1} of ${a.count}`;
    const done = () => { loading = false; if (want !== i) show(); };
    img.onload = done; img.onerror = () => { label.textContent = `${frameName(a, f)} is gone`; done(); }; };
  range.addEventListener("input", () => { want = +range.value; show(); });
  card.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
    want = Math.max(0, Math.min(a.count - 1, want + +b.dataset.step)); range.value = want; show(); }));
}

async function openSheet(id, opener) {
  closeLightbox();
  releaseVideos();
  sheet = {job: {id, artifacts: []}, pictures: [], opener: opener || (sheet && sheet.opener)};
  $("sheet").hidden = false; document.body.style.overflow = "hidden";
  $("sheet-title").textContent = ""; $("sheet-meta").textContent = "";
  $("sheet-body").innerHTML = `<div class="empty" style="margin-top:18px">Looking at its outputs…</div>`;
  if (location.hash !== "#job=" + id) history.replaceState(null, "", "#job=" + id);
  $("sheet-close").focus();
  try {
    const r = await fetch("/api/job/" + encodeURIComponent(id), {cache: "no-store"});
    if (!sheet || sheet.job.id !== id) return;
    if (!r.ok) { $("sheet-body").innerHTML = `<div class="empty" style="margin-top:18px">This job isn't known any more.</div>`; return; }
    const v = await r.json();
    if (sheet && sheet.job.id === id) renderSheet(v);
  } catch (e) { if (sheet && sheet.job.id === id) $("sheet-body").innerHTML = `<div class="empty" style="margin-top:18px">The status page is offline.</div>`; }
}
function releaseVideos() { $("sheet-body").querySelectorAll("video").forEach(releaseVideo); }
function closeSheet() {
  closeLightbox();
  releaseVideos();
  const opener = sheet && sheet.opener;
  $("sheet").hidden = true; document.body.style.overflow = ""; $("sheet-body").innerHTML = ""; sheet = null;
  if (location.hash.startsWith("#job=")) history.replaceState(null, "", location.pathname);
  const row = opener && $("recent").querySelector(`tr[data-job="${CSS.escape(opener)}"]`);
  if (row) row.focus();
}

function openLightbox(key) {
  const i = sheet.pictures.findIndex(p => p.key === key); if (i < 0) return;
  sheet.lb = i; showLightbox(); $("lightbox").hidden = false; $("lb-close").focus();
}
function showLightbox() {
  const a = sheet.pictures[sheet.lb], img = $("lb-img");
  img.hidden = false; $("lb-msg").hidden = true;
  img.onerror = () => {  // stepped onto a picture this browser can't decode
    img.hidden = true; $("lb-msg").hidden = false; $("lb-msg").textContent = cantShow(a);
    $("lb-acts").innerHTML = acts(a, null, false); };
  img.src = fileUrl(a); img.alt = a.name;
  $("lb-name").innerHTML = `${esc(a.name)} <span class="sub">${esc(a.dir)} · ${size(a.size)} · ${sheet.lb + 1} of ${sheet.pictures.length}</span>`;
  $("lb-acts").innerHTML = acts(a, null, true);
}
function stepLightbox(d) { if (!sheet || !sheet.pictures.length) return;
  sheet.lb = (sheet.lb + d + sheet.pictures.length) % sheet.pictures.length; showLightbox(); }
function closeLightbox() {
  const wasOpen = !$("lightbox").hidden;
  $("lightbox").hidden = true; $("lb-img").removeAttribute("src");
  const tile = wasOpen && sheet && sheet.pictures[sheet.lb] && $("sheet-body").querySelector(`[data-lb="${sheet.pictures[sheet.lb].key}"]`);
  if (tile) tile.focus();
}

$("recent").addEventListener("click", e => { const row = e.target.closest("tr[data-job]"); if (row) openSheet(row.dataset.job, row.dataset.job); });
$("recent").addEventListener("keydown", e => { const row = e.target.closest("tr[data-job]");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openSheet(row.dataset.job, row.dataset.job); } });
$("sheet-close").addEventListener("click", closeSheet);
document.querySelector(".sheet-back").addEventListener("click", closeSheet);
document.addEventListener("click", e => {
  if (!sheet) return;
  const mac = e.target.closest("button[data-mac]");
  if (mac) return onMac(mac.dataset.mac, mac.dataset.key, mac.dataset.frame != null ? +mac.dataset.frame : undefined);
  const load = e.target.closest("button[data-load]");
  if (load) { const el = load.closest(".vid").querySelector("video"); load.remove(); el.hidden = false;
    el.preload = "metadata"; el.src = el.dataset.src; watchVideo(el); el.play().catch(() => {}); return; }
  const pic = e.target.closest("[data-lb]"); if (pic) openLightbox(pic.dataset.lb);
});
$("sheet-body").addEventListener("keydown", e => { const pic = e.target.closest("[data-lb]");
  if (pic && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openLightbox(pic.dataset.lb); } });
$("lb-prev").addEventListener("click", () => stepLightbox(-1));
$("lb-next").addEventListener("click", () => stepLightbox(1));
$("lb-close").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => {
  if (!$("lightbox").hidden) {
    if (e.key === "Escape") closeLightbox(); else if (e.key === "ArrowLeft") stepLightbox(-1); else if (e.key === "ArrowRight") stepLightbox(1);
  } else if (!$("sheet").hidden && e.key === "Escape") closeSheet();
});
const fromHash = () => { const m = location.hash.match(/^#job=([A-Za-z0-9_.-]+)$/);
  if (m && (!sheet || sheet.job.id !== m[1])) openSheet(m[1]); else if (!m && sheet) closeSheet(); };
window.addEventListener("hashchange", fromHash);
fromHash();

refresh();
setInterval(refresh, 3000);
</script>
</body>
